name: Validate Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql, bcmath, curl, sockets, zip
          coverage: none

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Copy Environment Configuration
        run: cp .env.example .env

      - name: Validate lockfiles
        run: |
          test -f composer.lock || {
            echo "::error::composer.lock is missing"
            exit 1
          }
          test -f package-lock.json || {
            echo "::error::Root package-lock.json is missing"
            exit 1
          }
          test -f whatsapp-service/package-lock.json || {
            echo "::error::whatsapp-service/package-lock.json is missing"
            exit 1
          }

      - name: Prepare Isolated CI Environment
        run: |
          touch database/database.sqlite
          sed -i 's|^DB_CONNECTION=.*|DB_CONNECTION=sqlite|' .env
          sed -i 's|^DB_DATABASE=.*|DB_DATABASE=${{ github.workspace }}/database/database.sqlite|' .env
          sed -i 's|^SESSION_DRIVER=.*|SESSION_DRIVER=file|' .env
          sed -i 's|^CACHE_STORE=.*|CACHE_STORE=file|' .env
          sed -i 's|^QUEUE_CONNECTION=.*|QUEUE_CONNECTION=sync|' .env
          sed -i 's|^APP_MAINTENANCE_STORE=.*|APP_MAINTENANCE_STORE=file|' .env

      - name: Install Composer Dependencies
        run: |
          composer validate --no-check-publish
          composer install \
            --no-ansi \
            --no-interaction \
            --no-scripts \
            --no-progress \
            --prefer-dist

      - name: Generate Application Key
        run: php artisan key:generate --force -v

      - name: Install Root NPM Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Install WhatsApp Service Dependencies
        working-directory: whatsapp-service
        run: npm ci

      - name: Execute Artisan Route & Config Validation
        run: |
          php artisan route:list -v
          php artisan config:clear
