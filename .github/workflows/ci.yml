name: Validate Application

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql, bcmath, curl, sockets, zip
          coverage: none

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Prepare Isolated CI Environment
        run: |
          mkdir -p database storage/framework/cache storage/framework/sessions storage/framework/views storage/logs
          touch database/database.sqlite
          cat << 'EOF' > .env
          APP_NAME=NetManager
          APP_ENV=testing
          APP_KEY=
          APP_DEBUG=true
          APP_URL=http://localhost:8000
          DB_CONNECTION=sqlite
          DB_DATABASE=database/database.sqlite
          SESSION_DRIVER=file
          CACHE_STORE=file
          QUEUE_CONNECTION=sync
          APP_MAINTENANCE_DRIVER=file
          APP_MAINTENANCE_STORE=file
          EOF

      - name: Install Composer Dependencies
        run: |
          composer validate --no-check-publish
          composer install \
            --no-ansi \
            --no-interaction \
            --no-scripts \
            --no-progress \
            --prefer-dist

      - name: Generate Application Key
        run: php artisan key:generate --force -vvv

      - name: Run Database Migrations
        run: php artisan migrate --force -vvv

      - name: Seed E2E Test Data
        run: php artisan db:seed --force -vvv

      - name: Install Root NPM Dependencies
        run: npm ci

      - name: Build Assets
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Typecheck Playwright Tests
        run: npm run typecheck:e2e

      - name: Run Playwright E2E Tests
        env:
          E2E_CUSTOMER_EMAIL: budi@netmanager.local
          E2E_INACTIVE_EMAIL: customer@gmail.com
          E2E_TEST_PASSWORD: password
        run: npm run test:e2e

      - name: Upload Playwright Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Install WhatsApp Service Dependencies
        working-directory: whatsapp-service
        run: npm ci

      - name: Execute Artisan Route & Config Validation
        run: |
          php artisan route:list -vvv
          php artisan config:clear -vvv
