services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: netmanager-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_URL=${APP_URL:-http://localhost:8000}
      - DB_CONNECTION=mysql
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=${DB_DATABASE:-db_netmanager}
      - DB_USERNAME=${DB_USERNAME:-netmanager}
      - DB_PASSWORD=${DB_PASSWORD:-secret}
      - WA_API_URL=http://whatsapp:3000
      - RUN_MIGRATIONS=${RUN_MIGRATIONS:-true}
    volumes:
      - app_storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
      whatsapp:
        condition: service_started

  mysql:
    image: mysql:8.0
    container_name: netmanager-mysql
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    ports:
      - "${DB_PORT:-3306}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-db_netmanager}
      MYSQL_USER: ${DB_USERNAME:-netmanager}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootsecret}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD:-rootsecret} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  whatsapp:
    build:
      context: ./whatsapp-service
      dockerfile: Dockerfile
    container_name: netmanager-whatsapp
    restart: unless-stopped
    ports:
      - "${WA_PORT:-3000}:3000"
    volumes:
      - wa_auth_data:/app/.wwebjs_auth
      - wa_cache_data:/app/.wwebjs_cache

volumes:
  db_data:
    name: netmanager_db_data
  app_storage:
    name: netmanager_app_storage
  wa_auth_data:
    name: netmanager_wa_auth_data
  wa_cache_data:
    name: netmanager_wa_cache_data
